version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lifeos_user}:${POSTGRES_PASSWORD:-lifeos_password}@db:5432/${POSTGRES_DB:-lifeos_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8001}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_secret}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ml-service:/app
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker -l info -B
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lifeos_user}:${POSTGRES_PASSWORD:-lifeos_password}@db:5432/${POSTGRES_DB:-lifeos_db}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
